name: Live data check

# Runs RaidReady's data code against tarkov.dev's real, current files (PvP and
# PvE) to catch changes in their data before players hit them. The normal
# tests use saved fake data and never touch the internet; this does.
# The downloaded files are kept for a week as the "live-data" artifact, so the
# app can be replayed on real data elsewhere.
#
# It also runs every Monday morning on its own. If tarkov.dev has changed
# something that breaks the app, the run fails and GitHub emails the repo
# owner. (GitHub pauses weekly runs after 60 days without any commits; it
# emails a warning first, and one click on the Actions tab turns them back on.)

on:
  schedule:
    - cron: "23 7 * * 1"  # Mondays 07:23 UTC
  workflow_dispatch:
  push:
    paths:
      - "tarkov_display/staticapi.py"
      - "tarkov_display/datasets.py"
      - "tarkov_display/prices.py"
      - "tests/live_check.py"
      - "tests/replay.py"
      - "tests/ui_crawl.mjs"
      - ".github/workflows/live-data.yml"

permissions:
  contents: read

jobs:
  live:
    # Not ubuntu-latest: that moved to 26.04, which Playwright 1.56 has no browser for.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Tried twice, 10 minutes apart, so a brief tarkov.dev outage doesn't
      # send a false alarm.
      - name: Check the app against tarkov.dev's live data
        run: |
          python -m tests.live_check --save live-data --graphql --items 60 || {
            echo "Failed; trying again in 10 minutes in case tarkov.dev was briefly down."
            sleep 600
            rm -rf live-data
            python -m tests.live_check --save live-data --graphql --items 60
          }

      - name: Install a browser for the crawl
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      # The whole app on the real data: every page in PvP and PvE, every quest,
      # the raid plan for every map with every quest pinned, item panels.
      - name: Crawl the app on the real data
        run: |
          python -m tests.replay live-data 47999 > replay.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:47999/ && break; sleep 1; done
          node tests/ui_crawl.mjs http://127.0.0.1:47999/

      - name: App log from the crawl
        if: always()
        run: grep -E "WARNING|ERROR|Traceback" -A4 replay.log | head -200 || true
      - name: Keep the downloaded files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-data
          path: live-data/
          retention-days: 7
          if-no-files-found: ignore

  # Every map's quest markers from the real data, compressed into this job's
  # log, so they can be drawn on tarkov.dev's drawings and checked by eye.
  quest-maps:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Quest markers on every map
        run: python -m tests.live_check --only-quest-maps --dump-quest-maps
