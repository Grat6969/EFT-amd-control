name: Release

# Builds the Windows downloads (the app plus its own copy of Python, so players
# have nothing else to install) and publishes them as a GitHub release whenever
# the version number changes on the default branch. Two artifacts, both built
# from the same folder, so both keep the in-app updater working:
#   - RaidReadySetup.exe  (one-click installer; the main download)
#   - RaidReady-windows.zip  (portable, unzip and run)
# The names are fixed, so these links always get the newest:
# https://github.com/<owner>/<repo>/releases/latest/download/RaidReadySetup.exe
# https://github.com/<owner>/<repo>/releases/latest/download/RaidReady-windows.zip

on:
  push:
    paths:
      - "tarkov_display/__init__.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q

  release:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tarkov_display; print(tarkov_display.__version__)"
          gh release view "v$version" --repo "${{ github.repository }}" *> $null
          $released = $LASTEXITCODE -eq 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "released=$released" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, already released: $released"
          exit 0

      - name: Build RaidReady-windows.zip
        if: steps.version.outputs.released != 'True'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD 'dist'
          $app = Join-Path $out 'RaidReady'
          New-Item -ItemType Directory -Force $app | Out-Null

          # The app: what the in-app updater downloads too, minus the tests.
          Get-ChildItem -Force | Where-Object { $_.Name -notin '.git', '.github', 'tests', 'docs', 'dist', 'pytest.ini', '.gitignore' } |
            Copy-Item -Destination $app -Recurse

          # Python: the official python.org build setup-python installed, trimmed to
          # what the app uses. Its site-packages starts over with just pip: the
          # runner's copy also has its installer and tools such as pipx.
          $pyHome = Split-Path (Get-Command python).Source
          $py = Join-Path $app 'python'
          Copy-Item $pyHome $py -Recurse
          Remove-Item (Join-Path $py 'python-*.exe') -Force
          foreach ($sub in 'Doc', 'include', 'libs', 'Scripts', 'Tools', 'share', 'NEWS.txt', 'Lib\test', 'Lib\idlelib', 'Lib\turtledemo', 'Lib\ensurepip', 'Lib\lib2to3', 'Lib\pydoc_data', 'Lib\tkinter\test', 'tcl\tix8.4.3', 'DLLs\_test*.pyd', 'DLLs\xxlimited*.pyd') {
            Remove-Item (Join-Path $py $sub) -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem (Join-Path $py 'Lib\site-packages') |
            Where-Object { $_.Name -ne 'pip' -and $_.Name -notlike 'pip-*.dist-info' -and $_.Name -ne 'README.txt' } |
            Remove-Item -Recurse -Force
          & "$py\python.exe" -m pip install --disable-pip-version-check --no-warn-script-location -r requirements.txt
          if ($LASTEXITCODE) { throw 'Installing the packages failed' }

          # A ._pth file makes this Python ignore any other Python on the PC
          # (registry, PYTHONPATH, PYTHONHOME) and puts the app folder on its path.
          $tag = & "$py\python.exe" -c "import sys; print('%d%d' % sys.version_info[:2])"
          Set-Content -Encoding ascii (Join-Path $py "python$tag._pth") '.', 'Lib', 'DLLs', '..', 'import site'

          # The app icon, for the installer's shortcuts (and harmless in the zip).
          Copy-Item 'installer\raidready.ico' (Join-Path $app 'raidready.ico')

          Compress-Archive -Path $app -DestinationPath (Join-Path $out 'RaidReady-windows.zip') -CompressionLevel Optimal
          Get-Item (Join-Path $out 'RaidReady-windows.zip') | Format-Table Name, Length

      - name: Build RaidReadySetup.exe
        if: steps.version.outputs.released != 'True'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE) { throw 'Installing Inno Setup failed' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\raidready.iss
          if ($LASTEXITCODE) { throw 'Compiling the installer failed' }
          Get-Item dist\RaidReadySetup.exe | Format-Table Name, Length

      - name: Check the download works on a clean PC
        if: steps.version.outputs.released != 'True'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Unzip somewhere else and hide every other Python, like on a player's PC.
          $test = Join-Path $env:RUNNER_TEMP 'unzipped'
          Expand-Archive dist\RaidReady-windows.zip $test
          $exe = Join-Path $test 'RaidReady\python\python.exe'
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $env:PYTHONPATH = 'C:\nowhere'  # ignored thanks to the ._pth file
          $check = Join-Path $env:RUNNER_TEMP 'check.py'
          @'
          import os, sys
          print(sys.version)
          print("prefix", sys.prefix)
          assert "unzipped" in sys.prefix, "not the bundled Python"
          extra = [f for f in os.listdir(sys.prefix) if f.startswith("python-") and f.endswith(".exe")]
          assert not extra, f"installer left in: {extra}"
          import tarkov_display, tarkov_display.cli, tarkov_display.ocr, tarkov_display.popup
          print("RaidReady", tarkov_display.__version__, "from", os.path.dirname(tarkov_display.__file__))
          assert "unzipped" in tarkov_display.__file__
          from winrt.windows.globalization import Language
          from winrt.windows.graphics.imaging import BitmapAlphaMode, BitmapPixelFormat, SoftwareBitmap
          from winrt.windows.media.ocr import OcrEngine
          from winrt.windows.storage.streams import DataWriter
          print("OCR engine:", OcrEngine.try_create_from_user_profile_languages() is not None)
          import tkinter
          print("Tcl", tkinter.Tcl().eval("info patchlevel"))
          assert os.path.isdir(os.path.join(sys.prefix, "tcl", "tk8.6")), "Tk library missing"
          try:
              root = tkinter.Tk()
              root.withdraw()
              root.update()
              root.destroy()
              print("Tk window: ok")
          except Exception as exc:
              print("Tk window: not available here:", exc)
          '@ | Set-Content -Encoding utf8 $check
          Push-Location $env:RUNNER_TEMP
          & $exe $check
          if ($LASTEXITCODE) { throw 'The bundled app failed to start' }
          & $exe -m tarkov_display --help
          if ($LASTEXITCODE) { throw 'python -m tarkov_display failed' }
          & $exe -m pip --version
          if ($LASTEXITCODE) { throw 'pip is missing' }
          Pop-Location

          # The installer: a silent per-user install to a temp folder, then run
          # the installed copy. /TASKS= selects no optional tasks (no desktop icon).
          $instdir = Join-Path $env:RUNNER_TEMP 'installed'
          Start-Process -FilePath dist\RaidReadySetup.exe -Wait -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=',"/DIR=$instdir"
          foreach ($f in 'python\python.exe', 'tarkov_display\__init__.py', 'raidready.ico', 'run.bat') {
            if (-not (Test-Path (Join-Path $instdir $f))) { throw "Installer did not place $f" }
          }
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\RaidReady.lnk'
          if (-not (Test-Path $lnk)) { throw 'Installer did not create the Start Menu shortcut' }
          Push-Location $instdir
          & "$instdir\python\python.exe" -m tarkov_display --help
          if ($LASTEXITCODE) { throw 'The installed app failed to start' }
          Pop-Location
          Write-Host 'Installer verified: installs, places the app and shortcut, and runs.'

      - name: Publish the release
        if: steps.version.outputs.released != 'True'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $notes = @"
          **Download ``RaidReadySetup.exe`` below and run it.** It installs RaidReady and adds a Start Menu shortcut. The installer comes with its own Python, so there's nothing else to install.

          Windows may say "Windows protected your PC" (the installer isn't signed yet): click **More info**, then **Run anyway**.

          Prefer a portable copy? ``RaidReady-windows.zip`` is the same app in a folder: unzip it and double-click ``run.bat``.

          Already using RaidReady? Press **Update** in the app, or run the new installer over the top. Your settings and progress are kept either way.

          What it does, and how it stays clear of the game: see the [README](https://github.com/${{ github.repository }}#readme).
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_.Trim() }) -join "`n"
          gh release create "v$version" dist\RaidReadySetup.exe dist\RaidReady-windows.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "RaidReady $version" --notes $notes
          if ($LASTEXITCODE) { throw 'Creating the release failed' }
